<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Graphs as code</title>
  <desc id="desc">Three lines of TMC++ on the left, and on graph paper to the right, the dashed red parabola and blue focus point they draw.</desc>
  <defs>
    <clipPath id="frame"><rect width="600" height="190" rx="10"/></clipPath>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse" x="455" y="140">
      <path d="M22 0H0V22" stroke="#C9D3DE" stroke-opacity=".55"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="190" fill="#EEF2F6"/>
    <rect x="330" width="270" height="190" fill="#FBFCFD"/>
    <rect x="330" width="270" height="190" fill="url(#paper)"/>
    <path d="M330 140H600M455 0V190" stroke="#6B7785" stroke-width="1.2"/>
    <path d="M345 30Q455 250 565 30" stroke="#C74440" stroke-width="3" stroke-dasharray="9 6" stroke-linecap="round"/>
    <circle cx="455" cy="112.5" r="6" fill="#2D70B3"/>
    <circle cx="455" cy="112.5" r="11" stroke="#2D70B3" stroke-opacity=".35" stroke-width="2"/>
    <text x="470" y="108" fill="#2D70B3" font-family="'Courier New', monospace" font-size="12" font-weight="700">focus</text>
    <g font-family="'Courier New', monospace" font-size="13" font-weight="700">
      <text x="28" y="78" fill="#3A4452">class <tspan fill="#C74440">curve</tspan> { <tspan fill="#C74440">#c74440</tspan> dashed }</text>
      <text x="28" y="102" fill="#3A4452">y = x^2 / (4p)  <tspan fill="#C74440">.curve</tspan></text>
      <text x="28" y="126" fill="#3A4452">(0, p) <tspan fill="#2D70B3">#blue</tspan> point label</text>
    </g>
    <path d="M292 97H318M309 88L318 97L309 106" stroke="#C74440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="33" fill="#4A5563" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">03 / GRAPHS AS CODE</text>
    <text x="28" y="171" fill="#4A5563" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.6">DESMOS, WITH CLASSES.</text>
  </g>
</svg>
